name: Deploy the playground

# Publishes web/dist to GitHub Pages on every push to main, or by hand. Pages must be enabled with
# "GitHub Actions" as source (Settings > Pages) before this workflow can deploy.
#
# It also publishes the site bundle (site.zip, manifest.json, _resources/) as the asset silverstripe-bundle.zip of the
# release "bundle", for other sites that use the engine (e.g. Explore Silverstripe).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Composer only: the site itself runs in PHP compiled to WebAssembly.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip
          tools: composer
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      # build/site from the site repository, the browser bundle and the web app.
      - run: npm run build

      - name: Publish the site bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run bundle:zip
          gh release view bundle >/dev/null 2>&1 \
            || gh release create bundle --title "Site bundle" --notes "The site bundle of the latest build of main, for sites that use the engine." --latest=false
          gh release upload bundle build/silverstripe-bundle.zip --clobber

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
