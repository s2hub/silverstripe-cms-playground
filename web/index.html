<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Silverstripe Playground</title>
    <meta name="description" content="Silverstripe CMS in your browser: PHP in WebAssembly, no server, no installation.">
    <style>
      :root {
        --toolbar: #1b2a3d;
        --toolbar-text: #f4f6f8;
        --muted: #a9b6c6;
        --accent: #0071c4;
        --error: #ff8a80;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: #fff;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        padding: 6px 12px;
        background: var(--toolbar);
        color: var(--toolbar-text);
      }

      header h1 {
        margin: 0 8px 0 0;
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
      }

      button {
        padding: 4px 10px;
        border: 1px solid #3b4f68;
        border-radius: 4px;
        background: #26384f;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--accent);
        border-color: var(--accent);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #status {
        flex: 1;
        min-width: 12em;
        color: var(--muted);
      }

      #status.error {
        color: var(--error);
      }

      .meta {
        color: var(--muted);
        white-space: nowrap;
      }

      #credentials {
        font-family: ui-monospace, monospace;
        color: var(--toolbar-text);
      }

      #sites-menu {
        position: relative;
      }

      #sites-menu summary {
        padding: 4px 10px;
        border: 1px solid #3b4f68;
        border-radius: 4px;
        background: #26384f;
        cursor: pointer;
        list-style: none;
      }

      #sites-menu summary::-webkit-details-marker {
        display: none;
      }

      #sites-menu summary::after {
        content: " ▾";
      }

      #sites-list {
        position: absolute;
        z-index: 10;
        top: calc(100% + 4px);
        left: 0;
        width: min(28rem, calc(100vw - 32px));
        max-height: 60vh;
        overflow: auto;
        margin: 0;
        padding: 6px;
        border: 1px solid #c9d2dc;
        border-radius: 6px;
        background: #fff;
        color: #1b2a3d;
        box-shadow: 0 6px 20px rgb(0 0 0 / 20%);
        list-style: none;
      }

      #sites-list li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        padding: 6px 8px;
        border-radius: 4px;
      }

      #sites-list li:hover {
        background: #f1f4f8;
      }

      #sites-list li.empty {
        display: block;
        color: #5c6b7c;
      }

      #sites-list a {
        color: var(--accent);
        font-weight: 600;
      }

      #sites-list .details {
        grid-column: 1;
        font-size: 12px;
        color: #5c6b7c;
      }

      #sites-list .actions {
        grid-row: 1 / span 2;
        grid-column: 2;
        align-self: center;
        display: flex;
        gap: 6px;
      }

      #sites-list button {
        background: #fff;
        border-color: #a7bfdc;
        color: var(--accent);
      }

      #sites-list button.delete {
        border-color: #d9a8ae;
        color: #a51d2d;
      }

      #sites-list button:hover {
        color: #fff;
      }

      iframe {
        flex: 1;
        width: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Silverstripe Playground</h1>
      <button id="open-site" type="button" disabled>Site</button>
      <button id="open-admin" type="button" disabled>CMS</button>
      <button id="new-site" type="button" disabled title="Start a new playground">New</button>
      <button id="reset-site" type="button" disabled title="Throw this playground away and start again from the same link">Start over</button>
      <button id="save-site" type="button" disabled title="Keep this playground in your browser">Save…</button>
      <button id="export-site" type="button" disabled title="Download the whole site as a zip">Export</button>
      <button id="import-site" type="button" disabled title="Start a playground from an exported zip">Import…</button>
      <input id="import-file" type="file" accept=".zip,application/zip" hidden>
      <details id="sites-menu">
        <summary>My sites</summary>
        <ul id="sites-list"></ul>
      </details>
      <span id="status" role="status">Loading</span>
      <span class="meta">Admin: <span id="credentials">…</span></span>
      <span class="meta" id="info"></span>
    </header>
    <iframe id="site" title="Silverstripe site"></iframe>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
